{% extends 'base.html' %}
{% block title %}회원 탈퇴 - Ecobot{% endblock %}
{% block content %}
<div class="login-container">
  <div class="login-card">
    <div class="login-logo"><div class="logo-icon">👋</div><h1>회원 탈퇴</h1>
      <p class="login-subtitle">계정이 비활성화되며 더 이상 로그인할 수 없습니다</p></div>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary btn-full"
              onclick="return confirm('정말 탈퇴하시겠습니까?')">탈퇴하기</button>
    </form>
    <div class="login-divider"><span></span></div>
    <a class="btn btn-outline btn-full" href="{% url 'members:profile' %}">취소</a>
  </div>
</div>
{% endblock %}
