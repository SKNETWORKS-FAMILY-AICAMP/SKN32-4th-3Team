{% extends 'base.html' %}
{% block title %}로그인 - Ecobot{% endblock %}
{% block content %}
<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🌿</div>
      <h1>Ecobot</h1>
      <p class="login-subtitle">생활 속 환경 실천 안내 챗봇</p>
    </div>
    {% if form.non_field_errors %}
      <div class="form-errors-top">{% for e in form.non_field_errors %}{{ e }}{% endfor %}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">아이디</label>
        <input type="text" name="username" id="id_username" placeholder="아이디를 입력하세요"
               value="{{ form.username.value|default:'' }}" required autofocus>
      </div>
      <div class="form-group">
        <label for="id_password">비밀번호</label>
        <input type="password" name="password" id="id_password" placeholder="비밀번호를 입력하세요" required>
      </div>
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit" class="btn btn-primary btn-full">로그인</button>
    </form>
    <div class="login-divider"><span>또는</span></div>
    <a class="btn btn-outline btn-full" href="{% url 'members:signup' %}">회원가입</a>
    <p class="login-link"><a href="{% url 'home' %}">← 홈으로 돌아가기</a></p>
  </div>
</div>
{% endblock %}
